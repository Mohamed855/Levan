<div id="initial-password-modal" tabindex="-1" aria-labelledby="initial-password-modalLabel" aria-hidden="true"
     data-modal-dismissible="false"      data-bs-backdrop="static" data-bs-keyboard="false"     class="modal fade">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
                            <div class="modal-header ">
                    <h5 id="initial-password-modalLabel" class="modal-title d-flex align-items-center">
                                                                                <i class="ti ti-key me-2 text-primary"></i>
                                                <span>تغيير كلمة المرور</span>
                    </h5>
                                    </div>
            
            <div class="modal-body ">
                <p class="text-muted">يجب تغيير كلمة المرور المؤقتة قبل استخدام النظام. بعد الحفظ، سجّل الدخول بكلمة المرور الجديدة.</p>
        <div class="row">
    <div class="col-12 mb-6">
        <div id="password-wizard" class="card">
        <div class="card-body">
            <form id="password-wizard-form" action="/password/change" method="POST" novalidate
                data-form-validate data-validation-url="/validate">
                <input type="hidden" name="_token" value="GdtplTk9yDpbSczOEXo4PkIQPkwNh2vNJSZfq2Lb" autocomplete="off">
                <div id="password-info-validation" class="content" data-form-step data-validation-fields="[&amp;quot;current_password&amp;quot;,&amp;quot;new_password&amp;quot;,&amp;quot;new_password_confirmation&amp;quot;]">
    <div class="row g-4">
                        <div   class="col-12" data-form-field data-field-name="current_password">
            <label class="form-label" for="current_password">
            كلمة المرور الحالية<span class="text-danger" aria-hidden="true"> *</span>        </label>
    
    <div class="input-group input-group-merge">
        <input id="current_password" name="current_password" type="password" value="" autocomplete="current-password"
             placeholder="············"  required            data-form-control aria-describedby="current_password-error"
            aria-invalid="false"
            class="form-control">
        <button type="button" class="input-group-text cursor-pointer" data-password-toggle="current_password"
            aria-label="إظهار كلمة المرور">
            <i class="ti ti-eye-off" aria-hidden="true"></i>
        </button>
    </div>

    
    <div id="current_password-error" class="invalid-feedback d-block" data-form-error role="alert"  hidden >
        
    </div>
</div>

                        <div   class="col-md-6" data-form-field data-field-name="new_password">
            <label class="form-label" for="new_password">
            كلمة المرور الجديدة<span class="text-danger" aria-hidden="true"> *</span>        </label>
    
    <div class="input-group input-group-merge">
        <input id="new_password" name="new_password" type="password" value="" autocomplete="new-password"
             placeholder="············"  required            data-form-control aria-describedby="new_password-error"
            aria-invalid="false"
            class="form-control" data-validation-dependents="new_password_confirmation">
        <button type="button" class="input-group-text cursor-pointer" data-password-toggle="new_password"
            aria-label="إظهار كلمة المرور">
            <i class="ti ti-eye-off" aria-hidden="true"></i>
        </button>
    </div>

    
    <div id="new_password-error" class="invalid-feedback d-block" data-form-error role="alert"  hidden >
        
    </div>
</div>

                        <div   class="col-md-6" data-form-field data-field-name="new_password_confirmation">
            <label class="form-label" for="new_password_confirmation">
            تأكيد كلمة المرور الجديدة<span class="text-danger" aria-hidden="true"> *</span>        </label>
    
    <div class="input-group input-group-merge">
        <input id="new_password_confirmation" name="new_password_confirmation" type="password" value="" autocomplete="new-password"
             placeholder="············"  required            data-form-control aria-describedby="new_password_confirmation-error"
            aria-invalid="false"
            class="form-control">
        <button type="button" class="input-group-text cursor-pointer" data-password-toggle="new_password_confirmation"
            aria-label="إظهار كلمة المرور">
            <i class="ti ti-eye-off" aria-hidden="true"></i>
        </button>
    </div>

    
    <div id="new_password_confirmation-error" class="invalid-feedback d-block" data-form-error role="alert"  hidden >
        
    </div>
</div>
                    </div>

                    <div class="mt-4 d-flex justify-content-between align-items-center">
    <button type="submit" data-save-button="true" class="btn btn-primary btn-next btn-submit">
    <span class="spinner-border spinner-border-sm me-1 d-none btn-spinner" role="status" aria-hidden="true"></span>
            <i class="ti ti-check me-1" aria-hidden="true"></i>
        <span class="btn-text">حفظ</span>
</button>
</div>
</div>
            </form>
        </div>
    </div>
    </div>
</div>
            </div>

                    </div>
    </div>
</div>
